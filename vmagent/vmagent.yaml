---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: last9-vmagent-01
  labels:
    app.kubernetes.io/instance: vmagent
    app.kubernetes.io/name: vmagent-operator
    last9_monitoring_agent: vmagent
    last9: enabled
spec:
  serviceScrapeSelector:
    matchLabels:
      last9: enabled
  podScrapeSelector:
    matchLabels:
      last9: enabled
  externalLabels:
    via_cluster: <via_cluster> # Todo: add a relevant cluster name. e.g: k8s cluster name
  remoteWrite:
    - url: <last9_remote_write_url> # Todo: append last9 remote write URL
      basicAuth:
        username:
          name: last9-basic-auth
          key: username
        password:
          name: last9-basic-auth
          key: password
  scrapeInterval: 1m
  statefulMode: true
  statefulStorage:
    volumeClaimTemplate:
      spec:
        resources:
          requests:
            storage: 20Gi # Todo: Default is 20Gi. Scale up after you have provisioned more if you need more
